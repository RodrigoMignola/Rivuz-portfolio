<!doctype html>
<html lang="es" class="no-js">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
  <title>RIVUZ - Portfolio de Diseño Web</title>
  <meta name="description" content="Portfolio de diseño web: una selección de proyectos creados en RIVUZ.">
  <meta name="theme-color" content="#ffffff">

  <link rel="canonical" href="https://rivuz-portfolio.netlify.app/">

  <!-- Open Graph / redes: vista previa al compartir el link (WhatsApp, LinkedIn, etc.) -->
  <meta property="og:type" content="website">
  <meta property="og:locale" content="es_AR">
  <meta property="og:url" content="https://rivuz-portfolio.netlify.app/">
  <meta property="og:site_name" content="RIVUZ">
  <meta property="og:title" content="RIVUZ - Portfolio de Diseño Web">
  <meta property="og:description" content="Una selección de proyectos de diseño web creados en RIVUZ.">
  <meta property="og:image" content="https://rivuz-portfolio.netlify.app/assets/og-image.png">
  <meta property="og:image:width" content="1200">
  <meta property="og:image:height" content="630">
  <meta property="og:image:alt" content="Diseños creados en RIVUZ">
  <meta name="twitter:card" content="summary_large_image">
  <meta name="twitter:image" content="https://rivuz-portfolio.netlify.app/assets/og-image.png">

  <!-- Favicon RIVUZ -->
  <link rel="icon" href="assets/favicon-rivuz.png" sizes="96x96" type="image/png">
  <link rel="icon" href="assets/favicon-32.png" sizes="32x32" type="image/png">
  <link rel="apple-touch-icon" href="assets/apple-touch-icon.png">

  <!-- Fuentes: Plus Jakarta Sans (display, sustituta de Basier Circle) + Switzer (UI/cuerpo).
       Se cargan sin bloquear el render; el font stack tiene fallbacks reales. -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link rel="preconnect" href="https://api.fontshare.com" crossorigin>
  <link rel="preconnect" href="https://cdn.fontshare.com" crossorigin>
  <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;1,600&display=swap" media="print" onload="this.media='all'">
  <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap" media="print" onload="this.media='all'">
  <noscript>
    <link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Plus+Jakarta+Sans:ital,wght@0,500;0,600;1,600&display=swap">
    <link rel="stylesheet" href="https://api.fontshare.com/v2/css?f[]=switzer@400,500,600&display=swap">
  </noscript>

  <script>
    // JS activo + intro solo en la primera visita de la sesión y sin reduced-motion
    (function (h) {
      h.classList.replace('no-js', 'js');
      try {
        if (!matchMedia('(prefers-reduced-motion: reduce)').matches && !sessionStorage.getItem('rivuz-intro')) {
          h.classList.add('has-intro');
          sessionStorage.setItem('rivuz-intro', '1');
        }
      } catch (e) { /* sin storage: sin intro */ }
    })(document.documentElement);
  </script>
  <link rel="stylesheet" href="css/styles.css">
  <script src="js/main.js" defer></script>
</head>
<body>
  <!-- Intro de marca (solo primera visita): la "R." aparece y la cortina sube revelando el hero -->
  <div class="intro" aria-hidden="true" data-intro>
    <div class="intro__logo"><span class="intro__mask"><span class="intro__r">R</span></span><span class="intro__dot"></span></div>
  </div>
  <a class="skip-link" href="#proyectos">Saltar a los proyectos</a>

  <!-- Fondo: grilla de puntos + resplandores azules que se desplazan lento (decorativo) -->
  <div class="bg" aria-hidden="true">
    <span class="bg__glow bg__glow--1"></span>
    <span class="bg__glow bg__glow--2"></span>
    <span class="bg__glow bg__glow--3"></span>
    <!-- Luz interactiva sobre la grilla de puntos (main.js) -->
    <canvas class="bg__light" data-light></canvas>
  </div>

  <!-- Barra de progreso de scroll (CSS scroll-timeline, con fallback JS) -->
  <div class="scroll-progress" aria-hidden="true"><span class="scroll-progress__bar" data-progress></span></div>

  <!-- Nav: pill flotante. Se oculta al bajar y reaparece al subir (main.js) -->
  <header class="site-header" data-header>
    <nav class="nav" aria-label="Principal">
      <ul class="nav__links" role="list">
        <li><a class="ghost-link" href="#proyectos" data-magnetic>Proyectos</a></li>
        <li><a class="ghost-link" href="#contacto" data-magnetic>Contacto</a></li>
      </ul>
    </nav>
  </header>

  <main id="main">
    <!-- HERO -->
    <section class="hero" id="top" aria-labelledby="hero-title">
      <!-- Collage decorativo: se genera desde el array `projects` (main.js) -->
      <div class="hero__collage" aria-hidden="true" data-collage></div>

      <div class="hero__content">
        <h1 class="hero__title" id="hero-title">
          <span class="hero__line"><span class="word" style="--wi:0"><span class="word__in">Diseños</span></span> <span class="word" style="--wi:1"><span class="word__in">creados</span></span></span>
          <span class="hero__line"><span class="word" style="--wi:2"><span class="word__in">en</span></span> <span class="word word--italic" style="--wi:3"><em class="word__in gradient-text">RIVUZ</em></span></span>
        </h1>
        <a class="btn-gradient hero__cta" href="#proyectos" data-magnetic>
          <span class="btn-gradient__ring" aria-hidden="true"></span>
          <span>Ver proyectos</span>
          <svg class="icon btn-gradient__icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M12 5v14M6 13l6 6 6-6"/></svg>
        </a>
      </div>
    </section>

    <!-- PROYECTOS -->
    <!-- Desktop: sección con pin, el scroll vertical mueve las cards en horizontal (GSAP).
         Mobile / sin JS / reduced-motion: carrusel nativo con scroll-snap. -->
    <section class="projects" id="proyectos" aria-labelledby="projects-title" data-projects>
      <div class="projects__pin" data-projects-pin>
        <div class="container projects__head">
          <h2 class="heading-lg" id="projects-title" data-reveal>Proyectos</h2>
          <div class="projects__meta" data-reveal style="--i:1">
            <p class="projects__count" aria-hidden="true"><span data-count-current>01</span> / <span data-count-total>08</span></p>
            <div class="projects__arrows">
              <button class="icon-btn" type="button" data-prev aria-label="Proyecto anterior">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
              </button>
              <button class="icon-btn" type="button" data-next aria-label="Proyecto siguiente">
                <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
              </button>
            </div>
          </div>
        </div>

        <!-- Filtro: los botones se generan desde `filters` (js/main.js) -->
        <div class="container projects__filters" data-reveal style="--i:2">
          <div class="filters" role="group" aria-label="Filtrar proyectos" data-filters></div>
          <p class="visually-hidden" aria-live="polite" data-filter-status></p>
        </div>

        <div class="projects__viewport" data-projects-viewport>
          <!-- Las cards se generan desde el array `projects` (js/main.js) -->
          <ul class="projects__track" role="list" data-projects-track></ul>
        </div>
        <noscript>
          <p class="container projects__noscript">Activá JavaScript para ver los proyectos.</p>
        </noscript>
      </div>
    </section>

    <!-- CONTACTO -->
    <section class="contact" id="contacto" aria-labelledby="contact-title">
      <div class="container contact__inner">
        <h2 class="heading-lg contact__title" id="contact-title" data-reveal>¿Trabajamos <em class="gradient-text">juntos</em>?</h2>
        <ul class="contact__links" role="list" data-reveal style="--i:1">
          <li>
            <a class="btn-gradient" href="mailto:mignolarodrigo@gmail.com" data-magnetic>
              <span class="btn-gradient__ring" aria-hidden="true"></span>
              <span>Email</span>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><rect x="3" y="5" width="18" height="14" rx="3"/><path d="m4 7 8 6 8-6"/></svg>
            </a>
          </li>
          <li>
            <a class="ghost-link ghost-link--arrow" href="https://wa.me/543447625627" target="_blank" rel="noopener noreferrer" data-magnetic>
              WhatsApp<span class="visually-hidden"> (se abre en una pestaña nueva)</span>
              <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M7 17 17 7M8 7h9v9"/></svg>
            </a>
          </li>
        </ul>
      </div>
    </section>
  </main>

  <!-- Galería modal para proyectos privados (type "galeria", ej. Basalto) -->
  <dialog class="gallery" aria-labelledby="gallery-title" data-gallery-dialog>
    <div class="gallery__head">
      <h2 class="gallery__title" id="gallery-title" data-gallery-title>Galería</h2>
      <p class="gallery__count" aria-live="polite" data-gallery-count></p>
      <button class="icon-btn gallery__close" type="button" aria-label="Cerrar galería" data-gallery-close>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M6 6l12 12M18 6 6 18"/></svg>
      </button>
    </div>
    <ul class="gallery__track" role="list" tabindex="0" aria-label="Imágenes del proyecto" data-gallery-track></ul>
    <div class="gallery__nav">
      <button class="icon-btn" type="button" aria-label="Imagen anterior" data-gallery-prev>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M19 12H5M11 6l-6 6 6 6"/></svg>
      </button>
      <button class="icon-btn" type="button" aria-label="Imagen siguiente" data-gallery-next>
        <svg class="icon" viewBox="0 0 24 24" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6"/></svg>
      </button>
    </div>
  </dialog>

  <footer class="site-footer">
    <div class="container site-footer__inner">
      <p><span data-year>2026</span> RIVUZ</p>
    </div>
  </footer>
</body>
</html>
